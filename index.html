<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FLOW X | FREE AI PFP EDIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.9); border: 1px solid #1e293b; border-radius: 20px; }
        #canvasOutput { max-width: 100%; border-radius: 15px; border: 2px solid #06b6d4; display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass p-8 w-full max-w-lg shadow-2xl">
        <h1 class="text-3xl font-black text-center text-cyan-400 italic mb-6 tracking-tighter">FLOW X FREE EDIT</h1>
        
        <div class="space-y-4">
            <input type="file" id="imageInput" class="w-full text-sm text-gray-400 file:bg-cyan-600 file:border-0 file:rounded-lg file:text-white file:px-4 file:py-2 cursor-pointer">
            
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="oldName" placeholder="Old Name" class="bg-slate-900 border border-slate-800 p-3 rounded-xl focus:outline-none text-sm">
                <input type="text" id="newName" placeholder="New Name" class="bg-slate-900 border border-slate-800 p-3 rounded-xl focus:outline-none text-sm">
            </div>

            <button onclick="startProcessing()" id="btn" class="w-full bg-cyan-600 hover:bg-cyan-500 py-4 rounded-xl font-bold uppercase tracking-widest transition-all">
                Change Name (FREE)
            </button>
        </div>

        <div id="status" class="text-center mt-4 text-xs text-cyan-500 font-mono"></div>
        
        <div class="mt-6">
            <canvas id="canvasOutput"></canvas>
            <a id="downloadLink" class="hidden block text-center mt-4 text-cyan-400 underline font-bold">DOWNLOAD PFP</a>
        </div>
    </div>

    <script>
        const GEMINI_KEY = "AIzaSyBvMBD4eu5uTravzZ07AphavMak6wqTmm8"; // Replace with your fresh key if this is blocked

        async function startProcessing() {
            const file = document.getElementById('imageInput').files[0];
            const oldN = document.getElementById('oldName').value;
            const newN = document.getElementById('newName').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btn');

            if(!file || !oldN || !newN) return alert("All fields required!");

            btn.disabled = true;
            status.innerText = "GEMINI ANALYZING IMAGE...";

            // 1. Convert image to Base64
            const base64 = await toBase64(file);
            const pureBase64 = base64.split(',')[1];

            // 2. Ask Gemini for coordinates of the text
            const prompt = `Find the text "${oldN}" in this image. Give me the coordinates (xmin, ymin, xmax, ymax) and the background hex color code behind the text. Return only JSON format like {"xmin": 10, "ymin": 20, "xmax": 100, "ymax": 50, "color": "#000000"}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/png", data: pureBase64 } }] }]
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                const coords = JSON.parse(aiText.match(/\{.*\}/s)[0]);

                status.innerText = "REWRITING TEXT ON CANVAS...";
                drawOnCanvas(file, coords, newN);

            } catch (err) {
                console.error(err);
                status.innerText = "Error! Gemini failed or key blocked.";
                btn.disabled = false;
            }
        }

        function drawOnCanvas(file, coords, newName) {
            const canvas = document.getElementById('canvasOutput');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                // Calculate real pixel positions
                const x = (coords.xmin / 1000) * canvas.width;
                const y = (coords.ymin / 1000) * canvas.height;
                const w = ((coords.xmax - coords.xmin) / 1000) * canvas.width;
                const h = ((coords.ymax - coords.ymin) / 1000) * canvas.height;

                // 3. Cover old text with background color
                ctx.fillStyle = coords.color || "#000000";
                ctx.fillRect(x, y, w, h);

                // 4. Add new text
                ctx.fillStyle = "white"; // You can make this dynamic
                ctx.font = `bold ${h * 0.8}px Arial`; // Scaling font to box height
                ctx.textAlign = "center";
                ctx.fillText(newName, x + (w/2), y + (h * 0.8));

                canvas.style.display = "block";
                document.getElementById('downloadLink').classList.remove('hidden');
                document.getElementById('downloadLink').href = canvas.toDataURL();
                document.getElementById('status').innerText = "DONE!";
                document.getElementById('btn').disabled = false;
            };
            img.src = URL.createObjectURL(file);
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
